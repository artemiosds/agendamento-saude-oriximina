name: Clean installation structural acceptance
on:
  push:
    branches: [main]
    paths:
      - 'scripts/provisioning/**'
      - 'provisioning/candidates/**'
      - '.github/workflows/clean-install-acceptance.yml'
  pull_request:
    paths:
      - 'scripts/provisioning/**'
      - 'provisioning/candidates/**'
      - '.github/workflows/clean-install-acceptance.yml'
permissions:
  contents: read
jobs:
  structural-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test candidate generation and target-only hardening
        run: python -m unittest discover -s scripts/provisioning -p 'test_*.py'
      - name: Generate and verify the real Lovable Cloud pilot release
        run: |
          python scripts/provisioning/release-pilot-kit.py provisioning/candidates/2026-11-08 provisioning/pilot-releases/b45b5fc2-4ab6-4383-bd72-693800aae0db/preflight.json "$RUNNER_TEMP/pilot-release"
          python - "$RUNNER_TEMP/pilot-release" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          sql = (root / "01-estrutura-PILOTO.sql").read_text()
          release = json.loads((root / "release.json").read_text())
          assert "Destino não vazio: instalação recusada" in sql
          assert "Instalação bloqueada: homologação" not in sql
          assert "moddatetime(" not in sql
          assert 'CREATE EXTENSION IF NOT EXISTS "moddatetime"' not in sql
          assert 'CREATE EXTENSION IF NOT EXISTS "pgcrypto"' not in sql
          assert 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"' not in sql
          assert 'CREATE EXTENSION IF NOT EXISTS "pg_trgm"' in sql
          assert 'CREATE EXTENSION IF NOT EXISTS "unaccent"' in sql
          assert release["project_id"] == "b45b5fc2-4ab6-4383-bd72-693800aae0db"
          assert release["empty_guard_preserved"] is True
          assert release["production_release"] is False
          print("PASS: real pilot release hash, Cloud extension compatibility and empty-target guard")
          PY
      - name: Install disposable PostgreSQL
        run: npm install --prefix "$RUNNER_TEMP/clean-kit-pg" --no-audit --no-fund @electric-sql/pglite@0.5.15
      - name: Restore complete captured schema in memory
        run: |
          node scripts/provisioning/restore-full-kit.mjs provisioning/candidates/2026-11-08 "$RUNNER_TEMP/clean-kit-pg/node_modules/@electric-sql/pglite/dist/index.js" "$RUNNER_TEMP/clean-kit-report"
          python -m json.tool "$RUNNER_TEMP/clean-kit-report/restore-result.json"
