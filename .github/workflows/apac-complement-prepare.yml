name: Verify approved complementary APAC source
on:
  push:
    branches: [qa/apac-complementar-20261125]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apac/fetch-complement-approved.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/Formulario_Apac_Laudo_Complementar.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Incorpora PDF complementar aprovado, SHA-256 verificado"
            git push origin HEAD:refs/heads/qa/apac-complementar-20261125
          fi
