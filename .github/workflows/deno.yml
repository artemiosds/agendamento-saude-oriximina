name: Deno edge functions

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31 # v1.1.2
        with:
          deno-version: v1.x

      - name: Lint Deno runtime code only
        run: deno lint supabase/functions/_shared/backoffice-license.ts supabase/functions/_shared/backoffice-license_test.ts supabase/functions/backoffice-license-status/index.ts

      - name: Verify Edge Function types
        run: deno check supabase/functions/backoffice-license-status/index.ts

      - name: Run Edge Function license tests
        run: deno test -A supabase/functions/_shared/backoffice-license_test.ts
